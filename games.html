<body class="inner">
  <!-- Background: gradient + two cheese layers (back moves slower than front) -->
  <div class="bg-gradient" aria-hidden="true"></div>
  <div class="bg-layer cheese-back"  data-speed="0.15" data-mouse="6"  aria-hidden="true"></div>
  <div class="bg-layer cheese-front" data-speed="0.4"  data-mouse="18" aria-hidden="true"></div>

  <!-- Top bar -->
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">Mouse Minded <em>Games</em></a>
      <nav class="site-nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="games.html" aria-current="page">Games</a>
        <a href="news.html">News</a>
        <a href="about.html">About</a>
        <a href="socials.html">Socials</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <!-- Page title band -->
    <section class="band band-solid band-title">
      <div class="wrap"><h1 class="page-title">Our Games</h1></div>
    </section>

    <!-- Coming soon band (stamped cheese pattern inside) -->
    <section class="band band-stamp band-coming band-grow">
      <div class="wrap">
        <div class="preview">
          <img src="img/preview.jpg?v=__BUILD__" alt="" width="1024" height="512">
          <h2 class="cheesy-text" data-text="Coming Soon"><span>Coming Soon</span></h2>
        </div>
        <p class="panel lede">Our mice are hard at work!</p>
      </div>
    </section>

    <!-- Open space: background cheese shows through -->
    <div class="dead-space" aria-hidden="true"></div>
  </main>

  <!-- Bottom bar -->
  <footer class="site-footer">
    <div class="footer-inner">
      <a class="footer-brand" href="index.html">
        <img src="img/cheese.png?v=__BUILD__" alt="" width="52" height="52">
        <span>Mouse Minded<br><em>Games</em></span>
      </a>
      <nav class="footer-links" aria-label="Footer">
        <a href="#" class="dead-link" aria-disabled="true">Contact Us</a>
        <a href="#" class="dead-link" aria-disabled="true">Privacy Policy</a>
        <a href="#" class="dead-link" aria-disabled="true">Terms of Use</a>
      </nav>

    </div>
  </footer>
