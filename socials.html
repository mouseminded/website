<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Socials — Mouse Minded Games</title>
  <meta name="description" content="Mouse Minded Games — indie game studio.">
  <link rel="icon" href="img/favicon.png?v=__BUILD__" type="image/png">
  <link rel="preload" href="fonts/YoungSerif-Regular.woff2?v=__BUILD__" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=__BUILD__">
</head>
<body class="inner">
  <!-- Background: gradient + two cheese layers (back moves slower than front) -->
  <div class="bg-gradient" aria-hidden="true"></div>
  <div class="bg-layer cheese-back"  data-speed="0.15" data-mouse="6"  aria-hidden="true"></div>
  <div class="bg-layer cheese-front" data-speed="0.4"  data-mouse="18" aria-hidden="true"></div>

  <!-- Top bar -->
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">Mouse Minded <em>Games</em></a>
      <nav class="site-nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="news.html">News</a>
        <a href="about.html">About</a>
        <a href="socials.html" aria-current="page">Socials</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <!-- Page title band -->
    <section class="band band-solid band-title">
      <div class="wrap"><h1 class="page-title">Socials</h1></div>
    </section>

    <!-- Description band (stamped): intro + one card per social account -->
    <section class="band band-stamp band-stamped band-grow">
      <div class="wrap">
        <p class="panel lede">Follow us on our socials for the latest and greatest!</p>

        <div class="social-row">
          <a class="social-card" href="https://x.com/mousemindedllc" target="_blank" rel="noopener">
            <img src="img/social/x.png?v=__BUILD__" alt="" width="320" height="320">
            <span class="panel social-name">X (Twitter)<small>@mousemindedllc</small></span>
          </a>

          <a class="social-card" href="https://www.facebook.com/profile.php?id=61594858096816" target="_blank" rel="noopener">
            <img src="img/social/facebook.png?v=__BUILD__" alt="" width="320" height="319">
            <span class="panel social-name">Facebook<small>Mouse Minded Games</small></span>
          </a>

          <a class="social-card" href="https://www.youtube.com/@mousemindedllc" target="_blank" rel="noopener">
            <img src="img/social/youtube.png?v=__BUILD__" alt="" width="320" height="224">
            <span class="panel social-name">YouTube<small>@mousemindedllc</small></span>
          </a>

          <!-- DISCORD (hidden for now). To turn it on:
               1. put the Discord icon at img/social/discord.png
               2. replace YOUR-INVITE with your server invite code
               3. delete this comment's opening and closing lines
          <a class="social-card" href="https://discord.gg/YOUR-INVITE" target="_blank" rel="noopener">
            <img src="img/social/discord.png?v=__BUILD__" alt="" width="320" height="320">
            <span class="panel social-name">Discord<small>Join the server</small></span>
          </a>
          -->
        </div>
      </div>
    </section>

    <!-- Open space: background cheese shows through -->
    <div class="dead-space" aria-hidden="true"></div>
  </main>

  <!-- Bottom bar -->
  <footer class="site-footer">
    <div class="footer-inner">
      <a class="footer-brand" href="index.html">
        <img src="img/cheese.png?v=__BUILD__" alt="" width="52" height="52">
        <span>Mouse Minded<br><em>Games</em></span>
      </a>
      <nav class="footer-links" aria-label="Footer">
        <a href="#" class="dead-link" aria-disabled="true">Contact Us</a>
        <a href="#" class="dead-link" aria-disabled="true">Privacy Policy</a>
        <a href="#" class="dead-link" aria-disabled="true">Terms of Use</a>
      </nav>
      <p class="copyright">&copy; <span id="year">2026</span> Mouse Minded LLC. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js?v=__BUILD__"></script>
</body>
</html>
